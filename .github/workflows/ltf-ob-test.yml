name: LTF-Ortstest H1 OB mit M5 OB

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ltf-ob-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Test laufen lassen
        run: python ltf_ob_test.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
      - name: Ergebnis speichern
        run: |
          git config user.name "orderblock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/ltf_ob_test.json
          git diff --staged --quiet || git commit -m "ltf ob test"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
