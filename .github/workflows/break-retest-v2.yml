name: Break and Retest V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: break-retest-v2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Version 2 berechnen (5 Maerkte)
        run: python break_retest_v2.py
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
      - name: Ergebnis speichern
        run: |
          git config user.name "orderblock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/break_retest_v2.json
          git diff --staged --quiet || git commit -m "break retest v2 result"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
