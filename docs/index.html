<style>
:root{--bg:#090c13;--card:#111725;--card2:#161e2e;--line:#20293c;--txt:#e8ecf4;--mut:#8792a7;--long:#22c55e;--short:#f43f5e;--acc:#3b82f6;--warn:#eab308}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{padding:16px;max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:12px}
h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
#upd{font-size:12px;color:var(--mut);text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
.sec{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:20px 2px 8px}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
.mc:last-child:nth-child(odd){grid-column:span 2}
.mc.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.mc .n{font-size:13px;color:var(--mut)}
.mc .p{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:6px}
.badge.long{background:rgba(34,197,94,.14);color:var(--long)}
.badge.short{background:rgba(244,63,94,.14);color:var(--short)}
.badge.neutral{background:rgba(148,163,184,.14);color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}
.btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-weight:600;-webkit-tap-highlight-color:transparent}
.btn.on{background:var(--acc);border-color:var(--acc)}
.btn.z{flex:0 0 46px;font-size:18px;padding:6px 0}
#cv{width:100%;height:56vh;min-height:300px;max-height:520px;display:block;touch-action:pan-y;border-radius:12px}
.info{font-size:13px;color:var(--mut);margin-top:10px}
.info b{color:var(--txt);font-weight:600}
.keys{font-size:13px;margin-top:6px;color:var(--mut)}
.keys .r{color:#fb7185}
.keys .s{color:#4ade80}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut);padding:8px 2px 0}
.tog input{width:18px;height:18px;accent-color:var(--acc)}
.sum{font-size:14px;margin-top:4px}
.sum b{font-weight:600}
.zi{padding:11px 12px;border-radius:12px;background:var(--card2);margin-top:8px;border-left:3px solid var(--line)}
.zi.long{border-left-color:var(--long)}
.zi.short{border-left-color:var(--short)}
.zi.ag{opacity:.6}
.zi .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.zi .r{font-variant-numeric:tabular-nums;font-weight:600}
.zi .meta{font-size:12px;color:var(--mut);margin-top:2px}
.chips{margin-top:6px}
.chips span{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#1c2438;color:var(--mut);margin-right:4px}
.st{font-size:11px;font-weight:600;color:var(--mut);white-space:nowrap}
.st.an{color:var(--warn)}
.pt{font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.pt.ziel{color:var(--long)}
.pt.stop{color:var(--short)}
.pt.offen{color:var(--warn)}
.pt.none{color:var(--mut)}
.mut{color:var(--mut)}
.cl-h{font-size:12px;font-weight:600;color:var(--txt);margin-top:10px}
.cl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin-top:4px;color:var(--mut)}
.cl .v{color:var(--txt);font-variant-numeric:tabular-nums}
.ok{color:var(--long);font-weight:600}
.no{color:var(--short);font-weight:600}
.q{color:var(--warn);font-weight:600}
.st-h{font-size:13px;font-weight:600;margin:2px 0 6px}
.stt{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.stt th,.stt td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.stt th{color:var(--mut);font-weight:600}
.stt tr.tot td{font-weight:600;border-bottom:0}
.stt .mut{font-size:11px}
[hidden]{display:none!important}
.tiles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.zdh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.zdr{margin-top:6px;color:#9aa4b8}
.sec2{margin-top:12px;font-weight:600;font-size:13px;color:#9aa4b8}
.tl{margin-top:6px;display:grid;gap:6px;font-size:13px}
.tl .tt{display:inline-block;min-width:92px;color:#7c879c}

.att-bar:empty{display:none}
.att-it{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid rgba(52,211,153,.5);background:rgba(52,211,153,.12);color:#e5e7eb;font:inherit;font-size:14px}
.att-note{font-size:13px;color:#9aa4b8}
.att{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;margin-left:4px}
.att.e{background:rgba(52,211,153,.18);color:#34d399}
.att.w{background:rgba(251,191,36,.16);color:#fbbf24}

<body>
<div class="wrap">
  <header>
    <h1>Orderblock Radar</h1>
    <div id="upd">Lade…</div>
  </header>

  <div class="row tabs" style="margin-top:12px">
    <button class="btn on" data-v="mk">Märkte</button>
    <button class="btn" data-v="st">Übersicht</button>
  </div>

  <div id="vSt" hidden>
    <div class="sec">Übersicht · Gewinnquote</div>
    <div class="card" id="ovst"></div>
  </div>

  <div id="vMk">
  <div class="sec">Märkte</div>
  <div class="att-bar" id="att"></div>
  <div class="mk" id="ov"></div>

  <div class="card" id="chart">
    <div id="trl" class="note"></div>
    <div class="row">
      <button class="btn on" data-f="M5">M5</button>
      <button class="btn" data-f="H1">H1</button>
      <button class="btn z" id="zin">+</button>
      <button class="btn z" id="zout">−</button>
    </div>
    <div style="margin-top:10px"><canvas id="cv"></canvas></div>
    <div class="row" id="posrow" style="margin-top:8px"><input type="range" id="pos" min="0" max="0" value="0" style="flex:1"></div>
    <div class="note" id="rng"></div>
    <div class="info" id="in"></div>
    <div class="keys" id="key"></div>
    <div class="note">Testtrade 1:1 ohne Spread, Stop an der Zonenkante. Der Einstieg erscheint erst nach der Bestätigungskerze.</div>
    <label class="tog"><input type="checkbox" id="lv"> Tageshoch und Tagestief</label>
    <label class="tog"><input type="checkbox" id="hz"> H1-Zonen im M5-Chart</label>
    <label class="tog"><input type="checkbox" id="ema13" checked> EMA 13 (violett) im Chart</label>
  </div>

  <div class="card" id="zdet" hidden></div>

  <div class="sec">Testtrades 1:1</div>
  <div class="card"><div class="sum" id="sum"></div></div>

  <div class="sec" id="zt">Zonen</div>
  <div id="list"></div>
  </div>
</div>

<script>
let DATA=null,frame="M5",cur="gold",NC={M5:60,H1:60};
let SEL=null,HITS=[];   // SEL = gewählte Zone ({k, tf}), HITS = Klickflächen der gezeichneten Zonen
let POS={M5:null,H1:null}; // POS = Zeit der linken Kerze im Ausschnitt (null = ganz rechts, neueste Kerze)
let labelsDrawn=[];
const STEPS=[30,45,60,90,150];
const CONF={M5:12,H1:6};
const STRONG=1.5; // Bestätigungskerze muss so groß sein wie der Impuls (x Durchschnittskörper der letzten 20)
function bodyAvg(cs,j){let s=0,n=0;for(let q=Math.max(0,j-20);q<j;q++){s+=Math.abs(cs[q].c-cs[q].o);n++;}return n?s/n:0;}
try{const s=localStorage.getItem("mk");if(s)cur=s;}catch(e){}
const cv=document.getElementById("cv");
const ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
const ST={frisch:"Frisch",angetestet:"Angetestet"};
const TR={long:"▲ Long",short:"▼ Short",neutral:"► Neutral"};
const LC={day:"96,165,250"};

function VALID(){return DATA?DATA.markets.filter(m=>m.frames&&m.frames.M5&&m.frames.H1):[];}
function M(){const v=VALID();return v.find(m=>m.key===cur)||v[0]||null;}
function fx(v,m){return v.toFixed(m.dec>2?m.dec:(m.price>1000?1:2));}
function tm(t){return new Date(t*1000).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}
function lastPrice(m){const cs=m.frames.M5.candles;return cs[cs.length-1].c;}
function num(v){return typeof v==="number"&&isFinite(v);}

// Testtrade 1:1 nach derselben Regel wie der Backtest:
// Zone angetestet mit Gegenkerze (Long: rot), dann große Bestätigungskerze in Trendrichtung (schließt über/unter der Vorkerze),
// Einstieg zum Schluss dieser Kerze, Stop an der Zonenkante, Ziel = gleicher Abstand.
function paperTrade(b,cs,f){
  const L=b.kind==="long";
  const idx=cs.findIndex(c=>c.t===b.t);
  if(idx<0)return {s:"fenster"};
  const broke=c=>L?c.c<b.lo:c.c>b.hi;
  const touched=c=>L?c.l<=b.hi:c.h>=b.lo;
  // Jeder Antest mit roter Gegenkerze zählt. Danach muss innerhalb von CONF eine große Bestätigungskerze kommen.
  let start;
  if("touch_t" in b){
    // Antest genau wie beim Alarm: ab der ersten Berührung NACH dem Impuls (die Impulskerze selbst zählt nicht)
    if(b.touch_t==null)return {s:"frisch"};
    start=cs.findIndex(c=>c.t>=b.touch_t);
    if(start<0)return {s:"frisch"};
  }else{
    start=idx+3;
  }
  let armed=-1,touchedAny=false,redTouch=false,ej=-1;
  for(let j=start;j<cs.length;j++){
    const c=cs[j];
    if(broke(c))return {s:"ungueltig"};
    const hit=touched(c);
    const red=L?c.c<c.o:c.c>c.o;
    if(hit)touchedAny=true;
    if(hit&&red){armed=j;redTouch=true;continue;}
    if(armed<0||j-armed>CONF[f])continue;
    const p=cs[j-1];
    const big=Math.abs(c.c-c.o)>=STRONG*bodyAvg(cs,j);
    if(big&&(L?(c.c>c.o&&c.c>p.h):(c.c<c.o&&c.c<p.l))){ej=j;break;}
  }
  if(ej<0){
    if(!touchedAny)return {s:"frisch"};
    return {s:redTouch?"warte":"kein"};
  }
  const ec=cs[ej];
  const e=ec.c;
  const stop=L?b.lo:b.hi;
  const risk=Math.abs(e-stop);
  if(!(risk>0))return {s:"warte"};
  const tgt=L?e+risk:e-risk;
  let res="offen",exitT=null;
  if(L?ec.l<=stop:ec.h>=stop){res="stop";exitT=ec.t;}
  else{
    for(let j=ej+1;j<cs.length;j++){
      const c=cs[j];
      const sh=L?c.l<=stop:c.h>=stop;
      const th=L?c.h>=tgt:c.l<=tgt;
      if(sh){res="stop";exitT=c.t;break;}
      if(th){res="ziel";exitT=c.t;break;}
    }
  }
  const last=cs[cs.length-1].c;
  const openR=res==="offen"?(L?(last-e):(e-last))/risk:null;
  return {s:res,ejT:ec.t,entry:e,stop:stop,tgt:tgt,risk:risk,openR:openR,exitT:exitT};
}

function tradesFor(m,f,list){
  const cs=m.frames[f].candles;
  return (list||m.frames[f].blocks).map(b=>({b:b,t:paperTrade(b,cs,f)}));
}

// Daten direkt aus dem Repo holen (ohne GitHub-Pages-Verzögerung), sonst die lokale Kopie
const RAW="https://raw.githubusercontent.com/simonmeraner93-hub/Gold-Orderblock/main/docs/data.json";
// Link aus Telegram (?m=gold&tf=M5&z=long-1794625800): öffnet direkt Markt, Zeitfenster und Zone
let deepDone=false;
function applyLink(){
  try{
    const p=new URLSearchParams(location.search);
    const k=p.get("m"),tf=p.get("tf"),z=p.get("z");
    if(!k||!DATA||!DATA.markets.some(x=>x.key===k))return false;
    cur=k;
    if(tf==="M5"||tf==="H1")frame=tf;
    if(z)SEL={k:z,tf:frame};
    try{history.replaceState(null,"",location.pathname);}catch(e){}
    return true;
  }catch(e){return false;}
}

async function load(){
  try{
    let r;
    try{r=await fetch(RAW+"?"+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("raw "+r.status);}
    catch(_){r=await fetch("data.json?"+Date.now(),{cache:"no-store"});}
    DATA=await r.json();
    const first=!deepDone; deepDone=true;
    const deep=first&&applyLink();
    render();
    if(deep)setTimeout(()=>$("chart").scrollIntoView({behavior:"smooth",block:"start"}),50);
  }catch(e){
    $("upd").textContent="Daten konnten nicht geladen werden ("+e.message+")";
  }
}

function overview(){
  const m0=M();
  $("ov").innerHTML=VALID().map(m=>{
    const p=num(m.price)?fx(m.price,m):"–";
    return '<button class="mc'+(m0&&m.key===m0.key?' sel':'')+'" data-k="'+m.key+'"><div class="n">'+m.name+(m.stale?' · alt':'')+'</div><div class="p">'+p+'</div><span class="badge '+m.trend+'">'+(TR[m.trend]||"–")+'</span>'+attBadge(m)+'</button>';
  }).join("");
}

// Trend-Kacheln (1D, 4H, 1H) und ein Satz wie "Long: mit 1H, gegen 1D, 4H neutral"
function trendLine(m){
  const T=m.trends||{H1:m.trend};
  const ti={D1:"1D",H4:"4H",H1:"1H"};
  const lab=t=>t==="long"?"▲ Long":t==="short"?"▼ Short":"◆ Neutral";
  const cls=t=>t==="long"||t==="short"?t:"neutral";
  const tiles=["D1","H4","H1"].filter(k=>k in T).map(k=>'<span class="badge '+cls(T[k])+'">'+ti[k]+" "+(T[k]?lab(T[k]):"–")+'</span>').join(" ");
  let s="H1 neutral: keine Richtung bevorzugt";
  const side=m.trend;
  if(side==="long"||side==="short"){
    const mit=[],gegen=[],neu=[];
    ["D1","H4","H1"].forEach(k=>{const t=T[k];if(!t)return;if(t===side)mit.push(ti[k]);else if(t==="neutral")neu.push(ti[k]);else gegen.push(ti[k]);});
    const j=a=>a.length>1?a.slice(0,-1).join(", ")+" und "+a[a.length-1]:a[0];
    const parts=[];
    if(mit.length)parts.push("mit "+j(mit));
    if(gegen.length)parts.push("gegen "+j(gegen));
    if(neu.length)parts.push(j(neu)+" neutral");
    s=(side==="long"?"Long":"Short")+": "+parts.join(", ");
  }
  return '<div class="tiles">'+tiles+'</div><div>'+s+'</div>';
}

function info(){
  const m=M();if(!m)return;
  $("trl").innerHTML=trendLine(m);
  const last=lastPrice(m);
  const r=[];
  ["H1","M5"].forEach(f=>{
    m.frames[f].blocks.forEach(b=>{
      if(last>=b.lo&&last<=b.hi)
        r.push(f+" "+(b.kind==="long"?"Long":"Short")+" "+fx(b.lo,m)+" – "+fx(b.hi,m)+(b.fvg==="offen"?" (FVG ?)":""));
    });
  });
  $("in").innerHTML=r.length?"Kurs liegt in: <b>"+r.join(" · ")+"</b>":"Kurs liegt in keiner Zone";
  const k=m.keyl||{};
  let h="";
  if(k.res&&num(k.res.p))h+='<span class="r">Widerstand '+fx(k.res.p,m)+'</span>';
  if(k.res&&k.sup&&num(k.res.p)&&num(k.sup.p))h+=" · ";
  if(k.sup&&num(k.sup.p))h+='<span class="s">Support '+fx(k.sup.p,m)+'</span>';
  $("key").innerHTML=h;
}

function summary(){
  const m=M();if(!m)return;
  const rows=tradesFor(m,frame).map(x=>x.t);
  const z=rows.filter(t=>t.s==="ziel").length;
  const s=rows.filter(t=>t.s==="stop").length;
  const o=rows.filter(t=>t.s==="offen");
  const closedR=z-s;
  const openSum=o.reduce((a,t)=>a+t.openR,0);
  $("sum").innerHTML="<b>"+z+"</b> Ziele · <b>"+s+"</b> Stops · <b>"+o.length+"</b> offen · Summe abgeschlossen: <b>"+(closedR>=0?"+":"")+closedR+" R</b>"+
    (o.length?" · offen: "+(openSum>=0?"+":"")+openSum.toFixed(2).replace(".",",")+" R":"")+
    "<br><span class='mut'>"+frame+", nur die letzten Kerzen im Chart, ohne Spread</span>";
}

// Übersicht oben: 14-Tage-Statistik aus dem Bot (persistent), Hauptregel und EMA-13-Variante
function statCell(s){
  if(!s)return'<span class="mut">–</span>';
  const closed=s.z+s.s;
  const pct=closed>0?Math.round(100*s.z/closed)+' %':'–';
  const R=(s.open_r>=0?"+":"")+(s.open_r||0).toFixed(2).replace(".",",");
  return '<b style="font-size:15px">'+pct+'</b> <span class="mut">('+s.z+' von '+closed+')</span><br>'+s.o+' offen · '+R+' R';
}
function statTotal(ms,key,tf){
  const t={z:0,s:0,o:0,open_r:0};let any=false;
  ms.forEach(m=>{const s=m[key]&&m[key][tf];if(!s)return;any=true;t.z+=s.z;t.s+=s.s;t.o+=s.o;t.open_r+=s.open_r||0;});
  return any?t:null;
}
function statTable(title,key,ms){
  const rows=ms.map(m=>'<tr><td>'+m.name+(m.stale?' · alt':'')+'</td><td>'+statCell(m[key]&&m[key].M5)+'</td><td>'+statCell(m[key]&&m[key].H1)+'</td></tr>').join("");
  return '<div class="st-h">'+title+'</div><table class="stt"><tr><th>Markt</th><th>M5</th><th>H1</th></tr>'+rows+
    '<tr class="tot"><td>Gesamt</td><td>'+statCell(statTotal(ms,key,"M5"))+'</td><td>'+statCell(statTotal(ms,key,"H1"))+'</td></tr></table>';
}
function statsView(){
  const ms=(DATA&&DATA.markets)||[];
  const has=ms.some(m=>m.stats||m.ema_stats);
  if(!has){$("ovst").innerHTML='<p class="mut">noch keine Daten</p>';return;}
  $("ovst").innerHTML=statTable("Hauptregel (Bestätigungskerze)","stats",ms)+
    '<div style="height:14px"></div>'+
    statTable("EMA-13-Variante (nur Test, kein Alarm)","ema_stats",ms)+
    '<p class="note">Bot-Speicher der letzten 14 Tage. Gewinnquote = Ziele ÷ (Ziele + Stops), offene Trades zählen nicht mit. R = Summe in Risikoeinheiten, ohne Spread.</p>';
}

// EMA 13 über die Schlusskurse (wie der Bot), gerechnet über alle geladenen Kerzen
function emaSeries(cs,n){const k=2/(n+1);const out=[];let e=null;for(const c of cs){e=e===null?c.c:e+(c.c-e)*k;out.push(e);}return out;}

function niceStep(range,n){
  const raw=range/n;
  const p=Math.pow(10,Math.floor(Math.log10(raw)));
  const f=raw/p;
  return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p;
}

function pill(x,y,text,col,alpha){
  ctx.font="600 10px system-ui,sans-serif";
  const w=ctx.measureText(text).width+12;
  ctx.fillStyle="rgba(9,12,19,.85)";
  ctx.fillRect(x,y,w,17);
  ctx.fillStyle="rgba("+col+","+(alpha==null?1:alpha)+")";
  ctx.fillText(text,x+6,y+12);
}

function zoneBox(b,cs,cw,W,padR,y,cl,prefix,dash){
  const idx=cs.findIndex(c=>c.t>=Math.max(b.t,cs[0].t));
  if(idx<0)return;
  const x0=idx*cw;
  // ungültige Zone endet bei der Kerze, die sie gebrochen hat; gültige reichen bis zum rechten Rand
  let x1=W-padR;
  if(b.status==="ungueltig"&&num(b.inv_t)){
    if(b.inv_t<cs[0].t)return;
    const j=cs.findIndex(c=>c.t>=b.inv_t);
    if(j>=0)x1=j*cw;
  }
  if(x1<=x0)return;
  const y1=cl(y(b.hi)),y2=cl(y(b.lo));
  const h=Math.max(2,y2-y1);
  const col=b.kind==="long"?"34,197,94":"244,63,94";
  const f2=(b.with?1:0.45)*(b.status==="ungueltig"?0.5:1);
  ctx.fillStyle="rgba("+col+","+((b.status==="angetestet"?0.07:0.12)*f2)+")";
  ctx.fillRect(x0,y1,x1-x0,h);
  HITS.push({x0,x1,y1,y2:y1+h,b,tf:prefix?"H1":frame});
  ctx.strokeStyle="rgba("+col+","+(0.45*f2)+")";
  ctx.lineWidth=1;
  ctx.setLineDash(dash?[4,3]:[]);
  ctx.strokeRect(x0+.5,y1+.5,x1-x0-1,h-1);
  ctx.setLineDash([]);
  const label=(prefix?prefix+" ":"")+(b.kind==="long"?"Long":"Short")+" OB"+(b.status==="angetestet"?" · angetestet":"")+(b.status==="ungueltig"?" · ungültig":"");
  // Beschriftung nur, wenn sie nicht über einer anderen Beschriftung liegt
  const ok=!labelsDrawn.some(p=>Math.abs(p.y-(y1+4))<16&&Math.abs(p.x-(x0+6))<170);
  if(ok){pill(x0+6,y1+4,label,col,f2);labelsDrawn.push({x:x0+6,y:y1+4});}
}

// Kerzen im Ausschnitt: NC Kerzen, verschoben über POS; POS null = ganz rechts (neueste). Die Kerzenliste reicht bis 00:00 zurück.
function winRange(all){
  const f=frame;
  const n=NC[f],maxS=Math.max(0,all.length-n);
  if(POS[f]==null)return [maxS,all.length];
  let i=all.findIndex(c=>c.t>=POS[f]);
  if(i<0)i=all.length;
  const s0=Math.min(i,maxS);
  return [s0,Math.min(all.length,s0+n)];
}
// Zonen, die im gezeigten Bild schon existierten und den sichtbaren Preisbereich berühren; nahe am letzten Kurs zuerst
function pickZones(list,cs,lo,hi,limit){
  const last=cs[cs.length-1].t,pNow=cs[cs.length-1].c;
  const dist=b=>b.hi<pNow?pNow-b.hi:b.lo>pNow?b.lo-pNow:0;
  const seen=new Set();
  const arr=list.filter(b=>b.t<=last&&!(b.hi<lo||b.lo>hi)&&!(b.status==="ungueltig"&&num(b.inv_t)&&b.inv_t<cs[0].t)).filter(b=>{const k=b.kind+b.t;if(seen.has(k))return false;seen.add(k);return true;});
  arr.sort((p,q)=>(p.status==="ungueltig")-(q.status==="ungueltig")||dist(p)-dist(q));
  return limit?arr.slice(0,limit):arr;
}

function draw(){
  const d=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*d;cv.height=H*d;
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,W,H);
  HITS=[];
  const m=M();if(!m)return;
  const all=m.frames[frame].candles;
  const [s0,s1]=winRange(all);
  const cs=all.slice(s0,s1);
  const maxS=Math.max(0,all.length-NC[frame]);
  const sl=$("pos");sl.max=maxS;sl.value=s0;
  if(!cs.length)return;
  $("rng").textContent=tm(cs[0].t)+" – "+tm(cs[cs.length-1].t);
  let lo=Math.min(...cs.map(c=>c.l)),hi=Math.max(...cs.map(c=>c.h));
  const pad=(hi-lo)*0.08||1;lo-=pad;hi+=pad;
  const padR=64,padT=10,padB=20;
  const cw=(W-padR)/cs.length;
  const y=p=>padT+(hi-p)/(hi-lo)*(H-padT-padB);
  const cl=v=>Math.max(padT,Math.min(H-padB,v));

  ctx.font="11px system-ui,sans-serif";
  const step=niceStep(hi-lo,7);
  const dec=step>=1?0:Math.min(5,Math.max(0,Math.ceil(-Math.log10(step))));
  ctx.textAlign="left";
  for(let p=Math.ceil(lo/step)*step;p<=hi;p+=step){
    ctx.strokeStyle="rgba(148,163,184,.09)";
    ctx.beginPath();ctx.moveTo(0,y(p));ctx.lineTo(W-padR,y(p));ctx.stroke();
    ctx.fillStyle="#7c879c";
    ctx.fillText(p.toFixed(dec),W-padR+6,y(p)+4);
  }

  if($("hz").checked&&frame==="M5"){
    const h1=m.frames.H1;
    pickZones(h1.blocks.concat(h1.day||[]).filter(b=>b.status!=="ungueltig"),cs,lo,hi,0).forEach(b=>{
      zoneBox(b,cs,cw,W,padR,y,cl,"H1",true);
    });
  }
  // alle Zonen, die in diesem Ausschnitt schon existierten: gültige bis zum Rand, ungültige bis zu ihrer Bruchkerze
  labelsDrawn=[];
  const fr=m.frames[frame];
  pickZones(fr.blocks.concat(fr.day||[]),cs,lo,hi,0).forEach(b=>{
    zoneBox(b,cs,cw,W,padR,y,cl,null,false);
  });

  cs.forEach((c,i)=>{
    const x=i*cw+cw/2;
    const up=c.c>=c.o;
    ctx.strokeStyle=up?"#34d399":"#f87171";
    ctx.fillStyle=ctx.strokeStyle;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,y(c.h));ctx.lineTo(x,y(c.l));ctx.stroke();
    const top=y(Math.max(c.o,c.c));
    const hgt=Math.max(1,Math.abs(y(c.o)-y(c.c)));
    ctx.fillRect(x-Math.max(1,cw*0.36),top,Math.max(2,cw*0.72),hgt);
  });

  if($("ema13").checked){
    const em=emaSeries(all,13).slice(s0,s1);
    ctx.strokeStyle="rgba(167,139,250,.95)";
    ctx.lineWidth=1.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    em.forEach((v,i)=>{const x=i*cw+cw/2,yy=y(v);if(i)ctx.lineTo(x,yy);else ctx.moveTo(x,yy);});
    ctx.stroke();
    ctx.lineWidth=1;
  }

  if($("lv").checked){
    (m.levels||[]).forEach(l=>{
      if(!LC[l.k]||!num(l.p)||l.p<lo||l.p>hi)return;
      const yy=y(l.p);
      ctx.strokeStyle="rgba("+LC[l.k]+",0.7)";
      ctx.setLineDash([2,4]);
      ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle="rgba("+LC[l.k]+",1)";
      ctx.textAlign="right";
      ctx.fillText(l.n+" "+fx(l.p,m),W-padR-4,yy-3);
      ctx.textAlign="left";
    });
  }

  const inR=p=>p>=lo&&p<=hi;
  // nur die 2 neuesten Testtrades mit Einstieg im sichtbaren Bild, sonst wird es unübersichtlich
  tradesFor(m,frame,fr.day||fr.blocks).filter(x=>num(x.t.ejT)&&x.t.ejT>=cs[0].t&&x.t.ejT<=cs[cs.length-1].t).sort((p,q)=>q.t.ejT-p.t.ejT).slice(0,12).forEach(({b,t})=>{
    if(!(t.s==="ziel"||t.s==="stop"||t.s==="offen"))return;
    if(t.ejT<cs[0].t)return; // Einstieg liegt vor dem sichtbaren Ausschnitt: nicht einzeichnen (steht weiter in der Liste)
    const vi=cs.findIndex(c=>c.t>=t.ejT);
    if(vi<0)return;
    const x0=vi*cw+cw/2;
    // Linien nur bis zum Ausstieg (bei offenen Trades bis zum rechten Rand)
    const xi=t.exitT!=null?cs.findIndex(c=>c.t>=t.exitT):-1;
    const x1=xi>=vi?xi*cw+cw/2:W-padR;
    const L=b.kind==="long";
    const hline=(p,col,dash,w)=>{
      if(!inR(p))return;
      const yy=y(p);
      ctx.strokeStyle="rgba("+col+")";
      ctx.lineWidth=w;
      ctx.setLineDash(dash?[4,3]:[]);
      ctx.beginPath();ctx.moveTo(x0,yy);ctx.lineTo(x1,yy);ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth=1;
    };
    hline(t.entry,"255,255,255,.8",true,1);
    hline(t.stop,"244,63,94,.95",false,1.2);
    hline(t.tgt,"34,197,94,.95",false,1.2);
    ctx.font="600 10px system-ui,sans-serif";
    if(inR(t.entry)){
      ctx.fillStyle="rgba(255,255,255,.85)";
      ctx.textAlign="left";
      const et=(L?"Long":"Short")+" Einstieg "+fx(t.entry,m);
      const ex=Math.max(4,Math.min(x0+4,W-padR-ctx.measureText(et).width-4));
      ctx.fillText(et,ex,y(t.entry)-4);
    }
    const res=t.s==="ziel"?"✓ 1:1 erreicht":t.s==="stop"?"✗ Stop":"offen "+(t.openR>=0?"+":"")+t.openR.toFixed(2).replace(".",",")+" R";
    const col=t.s==="ziel"?"#4ade80":t.s==="stop"?"#fb7185":"#eab308";
    ctx.font="600 10px system-ui,sans-serif";
    const rw=ctx.measureText(res).width+12;
    const ry=inR(t.tgt)?y(t.tgt)-19:padT+2;
    const rx=Math.max(4,Math.min(x1-rw/2,W-padR-rw-2));
    ctx.fillStyle="rgba(9,12,19,.88)";
    ctx.fillRect(rx,ry,rw,17);
    ctx.fillStyle=col;
    ctx.fillText(res,rx+6,ry+12);
  });

  ctx.font="10px system-ui,sans-serif";
  ctx.fillStyle="#6b7689";
  ctx.textAlign="center";
  const every=Math.max(1,Math.ceil(cs.length/5));
  for(let i=0;i<cs.length;i+=every){
    ctx.fillText(new Date(cs[i].t*1000).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),i*cw+cw/2,H-5);
  }
  ctx.textAlign="left";

  const last=cs[cs.length-1].c;
  ctx.setLineDash([2,3]);
  ctx.strokeStyle="rgba(59,130,246,.6)";
  ctx.beginPath();ctx.moveTo(0,y(last));ctx.lineTo(W-padR,y(last));ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle="#3b82f6";
  ctx.fillRect(W-padR+1,y(last)-9,padR-2,18);
  ctx.font="600 11px system-ui,sans-serif";
  ctx.fillStyle="#fff";
  ctx.fillText(fx(last,m),W-padR+5,y(last)+4);
}

// Checkliste pro Zone: dieselben Regeln wie Telegram und Testtrades, mit Uhrzeit
function checklist(b,m){
  const Y='<span class="ok">✓</span>',N='<span class="no">✗</span>',Q='<span class="q">?</span>';
  const tr=m.trend==="neutral"?null:!!b.with;
  const rows=[
    ["Antest", b.touch_t?Y+" "+tm(b.touch_t):"noch nicht"],
    ["Liquidity-Sweep", b.sweep?Y+" "+b.sweep:N],
    ["H1-Trend", tr===null?Q+" kein klarer Trend":tr?Y+" mit dem Trend":N+" gegen den Trend"],
    ["FVG", b.fvg==="ja"?Y:Q+" noch nicht bekannt"],
    ["Bestätigung", b.conf_t?Y+" "+tm(b.conf_t):(b.touch_t?"noch offen":"–")],
    ["Früh-Einstieg", b.early_t?Y+" "+tm(b.early_t):"–"],
    ["EMA-13-Test", b.ema_t?Y+" "+tm(b.ema_t):"–"]
  ];
  const n=[!!b.touch_t,!!b.sweep,tr===true,b.fvg==="ja",!!b.conf_t].filter(Boolean).length;
  return '<div class="cl-h">Checkliste · '+n+' von 5 erfüllt</div><div class="cl">'+
    rows.map(r=>'<span>'+r[0]+'</span><span class="v">'+r[1]+'</span>').join("")+'</div>';
}

function list(){
  const m=M();if(!m)return;
  $("zt").textContent="Zonen "+m.name+" · "+frame;
  const last=lastPrice(m);
  const rows=tradesFor(m,frame).sort((a,b)=>Math.abs((a.b.lo+a.b.hi)/2-last)-Math.abs((b.b.lo+b.b.hi)/2-last));
  const txt={
    ziel:"✓ 1:1 erreicht",
    stop:"✗ Stop getroffen",
    offen:"","warte":"Angetestet, keine Bestätigung",
    frisch:"Noch nicht angetestet",
    ungueltig:"Zone durchbrochen",
    kein:"Antest nicht mit Gegenkerze",
    fenster:"Außerhalb des Fensters"
  };
  $("list").innerHTML=rows.map(({b,t})=>{
    const L=b.kind==="long";
    let pt;
    if(t.s==="ziel"||t.s==="stop"||t.s==="offen"){
      const r=t.s==="offen"?"offen "+(t.openR>=0?"+":"")+t.openR.toFixed(2).replace(".",",")+" R":txt[t.s];
      pt='<div class="pt '+t.s+'">Test: Einstieg '+fx(t.entry,m)+' · Stop '+fx(t.stop,m)+' · 1:1 '+fx(t.tgt,m)+'<br>→ '+r+'</div>';
    }else{
      pt='<div class="pt none">'+(txt[t.s]||"")+'</div>';
    }
    return '<div class="zi '+b.kind+(b.with?'':' ag')+'" data-zk="'+b.kind+'-'+b.t+'"><div class="h"><span><b>'+(L?'▲ Long':'▼ Short')+'</b> <span class="r">'+fx(b.lo,m)+' – '+fx(b.hi,m)+'</span></span><span class="st '+(b.status==="angetestet"?"an":"")+'">'+(ST[b.status]||"")+'</span></div>'+
      '<div class="meta">'+tm(b.t)+'</div>'+
      '<div class="chips"><span>'+(b.fvg==="ja"?"FVG ✓":"FVG ?")+'</span><span>'+(b.with?"mit dem Trend":"gegen den Trend")+'</span></div>'+checklist(b,m)+pt+'</div>';
  }).join("")||'<p class="mut">Keine Zonen in diesem Fenster</p>';
}

// Zonen-Detail: Verlauf (Entstehung, Berührungen, Bestätigung, Ungültig), Status und Checkliste
function zoneDetail(){
  const d=$("zdet");const m=M();
  let b=null;
  if(SEL&&m&&m.frames[SEL.tf]){
    const fr=m.frames[SEL.tf];
    b=fr.blocks.concat(fr.day||[]).find(x=>x.kind+"-"+x.t===SEL.k)||null;
  }
  if(!b){d.hidden=true;d.innerHTML="";return;}
  const L=b.kind==="long";
  const ev=[{t:b.t,s:"Zone entstanden"}];
  (b.visits||[]).forEach((v,i)=>ev.push({t:v.t,s:"Berührung "+(i+1)+": "+(v.in?"Schluss innerhalb der Zone":"Docht in der Zone, Schluss außerhalb")}));
  if(b.conf_t)ev.push({t:b.conf_t,s:"Bestätigungskerze (Einstieg-Signal)"});
  if(b.early_t)ev.push({t:b.early_t,s:"Früh-Einstieg"});
  if(b.ema_t)ev.push({t:b.ema_t,s:"EMA-13-Test erfüllt (nur Statistik)"});
  if(b.inv_t)ev.push({t:b.inv_t,s:L?"Ungültig: Schluss unter der Zone":"Ungültig: Schluss über der Zone"});
  ev.sort((p,q)=>p.t-q.t);
  const n=b.n_visits||0;
  const st=b.inv_t?"ungültig":(n?n+"× berührt":"unberührt");
  d.hidden=false;
  d.innerHTML='<div class="zdh"><b>'+(L?"▲ Long":"▼ Short")+'-Orderblock · '+SEL.tf+'</b><button class="btn z" id="zdx">×</button></div>'+
    '<div class="zdr">'+fx(b.lo,m)+' – '+fx(b.hi,m)+' · '+st+'</div>'+
    '<div class="sec2">Verlauf</div><div class="tl">'+ev.map(e=>'<div><span class="tt">'+tm(e.t)+'</span>'+e.s+'</div>').join("")+'</div>'+
    '<div class="chips"><span>'+(b.fvg==="ja"?"FVG ✓":"FVG ?")+'</span><span>'+(b.with?"mit dem Trend":"gegen den Trend")+'</span><span>'+(b.sweep?"Sweep ✓ "+b.sweep:"kein Sweep")+'</span></div>'+
    checklist(b,m);
  $("zdx").addEventListener("click",()=>{SEL=null;zoneDetail();});
}

// Klick auf eine Zone im Chart oder auf einen Eintrag in der Zonenliste
cv.addEventListener("click",e=>{
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  const hit=HITS.filter(h=>x>=h.x0&&x<=h.x1&&y>=h.y1&&y<=h.y2).pop();
  if(!hit)return;
  SEL={k:hit.b.kind+"-"+hit.b.t,tf:hit.tf};
  zoneDetail();
  $("zdet").scrollIntoView({behavior:"smooth",block:"nearest"});
});
$("list").addEventListener("click",e=>{
  const z=e.target.closest(".zi");
  if(!z||!z.dataset.zk)return;
  SEL={k:z.dataset.zk,tf:frame};
  zoneDetail();
  $("zdet").scrollIntoView({behavior:"smooth",block:"start"});
});

// Aufmerksamkeit: Einstiege (Bestätigung in den letzten 60 Min) und Zonen im Blick (Antest vor max. 3 Std., noch keine Bestätigung)
function attn(m){
  const now=Date.now()/1000;
  const out={e:[],w:[]};
  ["M5","H1"].forEach(tf=>{
    const fr=m.frames[tf];if(!fr)return;
    fr.blocks.forEach(b=>{
      if(b.conf_t&&now-b.conf_t<=3600)out.e.push({tf,b,t:b.conf_t});
      else if(!b.conf_t&&b.touch_t&&b.status==="angetestet"&&now-b.touch_t<=10800)out.w.push({tf,b,t:b.touch_t});
    });
  });
  out.e.sort((p,q)=>q.t-p.t);
  return out;
}
function attBadge(m){
  const a=attn(m);
  let h="";
  if(a.e.length)h+='<span class="att e">● '+a.e.length+' Einstieg</span>';
  if(a.w.length)h+='<span class="att w">◎ '+a.w.length+' im Blick</span>';
  return h;
}
function attBar(){
  const el=$("att");
  const now=Date.now()/1000;
  let items="",watch=[];
  VALID().forEach(m=>{
    const a=attn(m);
    a.e.forEach(x=>{
      const min=Math.max(0,Math.round((now-x.t)/60));
      items+='<button class="att-it" data-k="'+m.key+'" data-tf="'+x.tf+'" data-zk="'+x.b.kind+"-"+x.b.t+'"><b>'+m.name+' '+x.tf+'</b> · Einstieg vor '+min+' Min. · '+(x.b.kind==="long"?"▲ Long":"▼ Short")+' '+fx(x.b.lo,m)+' – '+fx(x.b.hi,m)+'</button>';
    });
    if(a.w.length)watch.push(m.name+" ("+a.w.length+")");
  });
  if(!items&&!watch.length){el.innerHTML="";return;}
  el.innerHTML=items+(watch.length?'<div class="att-note">Im Blick: '+watch.join(", ")+'</div>':"");
}
$("att").addEventListener("click",e=>{
  const t=e.target.closest("[data-zk]");if(!t)return;
  cur=t.dataset.k;frame=t.dataset.tf;
  SEL={k:t.dataset.zk,tf:t.dataset.tf};
  render();
  $("chart").scrollIntoView({behavior:"smooth",block:"start"});
});

function render(){
  if(!DATA)return;
  const err=[];
  [statsView,overview,attBar,info,summary,list,draw,zoneDetail].forEach(fn=>{
    try{fn();}catch(e){err.push(fn.name+": "+e.message);console.error(e);}
  });
  let u="Stand: "+new Date(DATA.updated).toLocaleString("de-DE");
  if(err.length)u+=" · Anzeigefehler: "+err.join(" | ");
  $("upd").textContent=u;
}

$("chart").addEventListener("click",e=>{
  const t=e.target.closest("button[data-f]");
  if(!t)return;
  frame=t.dataset.f;
  document.querySelectorAll("button[data-f]").forEach(b=>b.classList.toggle("on",b===t));
  render();
});
document.querySelector(".tabs").addEventListener("click",e=>{
  const t=e.target.closest("button[data-v]");if(!t)return;
  document.querySelectorAll("button[data-v]").forEach(b=>b.classList.toggle("on",b===t));
  const st=t.dataset.v==="st";
  $("vSt").hidden=!st;$("vMk").hidden=st;
  if(!st)draw();
  window.scrollTo(0,0);
});
function zoom(dir){
  let i=STEPS.indexOf(NC[frame]);if(i<0)i=2;
  i=Math.max(0,Math.min(STEPS.length-1,i+dir));
  NC[frame]=STEPS[i];
  draw();
}
$("zin").addEventListener("click",()=>zoom(-1));
$("zout").addEventListener("click",()=>zoom(1));
$("pos").addEventListener("input",e=>{
  const m=M();if(!m)return;
  const all=m.frames[frame].candles,v=+e.target.value;
  const maxS=Math.max(0,all.length-NC[frame]);
  POS[frame]=v>=maxS?null:all[v].t;
  draw();
});
$("ov").addEventListener("click",e=>{
  const o=e.target.closest(".mc");
  if(!o)return;
  cur=o.dataset.k;
  try{localStorage.setItem("mk",cur);}catch(err){}
  render();
});
["lv","hz","ema13"].forEach(id=>$(id).addEventListener("change",render));
window.addEventListener("resize",draw);
load();
setInterval(load,60000);
</script>
