<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Orderblock Radar</title>
<style>
body{margin:0;background:#0b0f17;color:#e6e9ef;font-family:system-ui,sans-serif}
header{padding:12px 14px}
h1{font-size:18px;margin:0 0 4px}
h2{font-size:15px;margin:14px 0 0}
#upd{font-size:12px;color:#8b93a5}
#trend{font-size:14px;margin-top:4px}
#key{font-size:13px;margin-top:6px}
#key .r{color:#f87171}
#key .s{color:#4ade80}
#in{font-size:13px;margin-top:6px;color:#facc15}
.tabs{display:flex;gap:8px;padding:0 14px 8px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid #2a3142;background:#141a26;color:#e6e9ef;font-size:15px}
.tabs button.on{background:#2b6cff;border-color:#2b6cff}
canvas{width:100%;height:55vh;display:block}
label{display:block;padding:4px 14px;font-size:14px;color:#8b93a5}
.list{padding:0 14px 20px}
.z{display:flex;justify-content:space-between;padding:10px;margin-top:8px;border-radius:10px;background:#141a26;border-left:4px solid}
.z.long{border-color:#22c55e}
.z.short{border-color:#ef4444}
.z.e{background:#1d2433}
.z.ag{opacity:.55}
.z small{color:#8b93a5;display:block}
.st{font-size:13px;align-self:center;text-align:right}
.z.h.win{border-color:#22c55e}
.z.h.loss{border-color:#ef4444}
.z.h.open{border-color:#facc15}
.z.h.unk{border-color:#6b7280}
.z.h small b{color:#e6e9ef}
</style>
</head>
<body>
<header>
<h1>Gold Orderblock Radar</h1>
<div id="upd">Lade...</div>
<div id="trend"></div>
<div id="key"></div>
<div id="in"></div>
</header>
<div class="tabs" id="tabs">
<button data-f="M5" class="on">M5</button>
<button data-f="M15">M15</button>
<button data-f="H1">H1</button>
</div>
<canvas id="cv"></canvas>
<label><input type="checkbox" id="lv" checked> Linien: Vortag und Tag (PDH/PDL, Hoch/Tief)</label>
<label><input type="checkbox" id="hz"> Zonen höherer Zeiteinheiten zeigen</label>
<label><input type="checkbox" id="inv"> ungültige Zonen zeigen</label>
<label><input type="checkbox" id="ag"> Zonen gegen den Trend ausblenden</label>
<div class="list">
<h2>Einstiege</h2>
<div id="ent"></div>
<h2>Auswertung (Ziel 1:1)</h2>
<div id="stat"></div>
<h2>Signale mit Ergebnis</h2>
<div id="hist"></div>
<h2>Test: Ausbruch M15 (Ziel 1:1)</h2>
<div id="bstat"></div>
<div id="bhist"></div>
<h2>Zonen</h2>
<div id="list"></div>
</div>
<script>
let DATA=null,frame="M5";
const ORDER=["M5","M15","H1"];
const cv=document.getElementById("cv");
const ctx=cv.getContext("2d");
const ST={frisch:"Frisch",angetestet:"Angetestet",ungueltig:"Ungültig"};
const TR={long:"Long (aufwärts)",short:"Short (abwärts)",neutral:"Neutral"};
const LC={pd:"251,146,60",day:"96,165,250"};

async function load(){
  try{
    const r=await fetch("data.json?"+Date.now());
    DATA=await r.json();
    document.getElementById("upd").textContent=
      "Stand: "+new Date(DATA.updated).toLocaleString("de-DE");
    document.getElementById("trend").textContent="H1-Trend: "+TR[DATA.trend||"neutral"];
    render();
  }catch(e){
    document.getElementById("upd").textContent="Daten konnten nicht geladen werden";
  }
}

function fblocks(f){
  const showInv=document.getElementById("inv").checked;
  const hideAg=document.getElementById("ag").checked;
  return DATA.frames[f].blocks.filter(b=>
    (showInv||b.status!=="ungueltig")&&(!hideAg||b.with));
}

function lastPrice(){
  const cs=DATA.frames.M5.candles;
  return cs[cs.length-1].c;
}

function info(){
  const last=lastPrice();
  const r=[];
  ["H1","M15","M5"].forEach(f=>{
    DATA.frames[f].blocks.forEach(b=>{
      if(b.status!=="ungueltig"&&last>=b.lo&&last<=b.hi){
        r.push(f+" "+(b.kind==="long"?"Long":"Short")+" "+b.lo.toFixed(2)+" - "+b.hi.toFixed(2));
      }
    });
  });
  document.getElementById("in").textContent=
    r.length?"Kurs liegt in: "+r.join(" · "):"Kurs liegt in keiner Zone";

  const k=DATA.key||{};
  let h="";
  if(k.res)h+='<span class="r">Widerstand '+k.res.p.toFixed(2)+' ('+k.res.n+', +'+(k.res.p-last).toFixed(1)+')</span>';
  if(k.res&&k.sup)h+=" · ";
  if(k.sup)h+='<span class="s">Support '+k.sup.p.toFixed(2)+' ('+k.sup.n+', -'+(last-k.sup.p).toFixed(1)+')</span>';
  document.getElementById("key").innerHTML=h;
}

function zone(b,cs,cw,W,padR,y,cl,name,dash){
  const idx=cs.findIndex(c=>c.t>=b.t);
  if(idx<0)return;
  const x0=idx*cw;
  const y1=cl(y(b.hi)),y2=cl(y(b.lo));
  let col,a;
  if(b.status==="ungueltig"){col="150,150,150";a=0.12}
  else if(b.status==="angetestet"){col=b.kind==="long"?"34,197,94":"239,68,68";a=0.15}
  else{col=b.kind==="long"?"34,197,94":"239,68,68";a=0.32}
  const f=b.with?1:0.45;
  const h=Math.max(2,y2-y1);
  ctx.fillStyle="rgba("+col+","+(a*(dash?0.7:1)*f)+")";
  ctx.fillRect(x0,y1,W-padR-x0,h);
  ctx.strokeStyle="rgba("+col+","+(0.85*f)+")";
  ctx.setLineDash(dash?[6,4]:[]);
  ctx.lineWidth=dash?1.5:1;
  ctx.strokeRect(x0,y1,W-padR-x0,h);
  ctx.setLineDash([]);
  ctx.lineWidth=1;
  if(name){
    ctx.fillStyle="rgba("+col+",1)";
    ctx.font="bold 11px sans-serif";
    ctx.fillText(name,x0+4,y1+12);
    ctx.font="11px sans-serif";
  }
}

function draw(){
  const d=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*d;cv.height=H*d;
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,W,H);
  if(!DATA)return;
  const cs=DATA.frames[frame].candles;
  const lo=Math.min(...cs.map(c=>c.l));
  const hi=Math.max(...cs.map(c=>c.h));
  const padR=52,padT=10,padB=16;
  const cw=(W-padR)/cs.length;
  const y=p=>padT+(hi-p)/(hi-lo)*(H-padT-padB);
  const cl=v=>Math.max(padT,Math.min(H-padB,v));

  ctx.font="11px sans-serif";
  ctx.fillStyle="#8b93a5";
  ctx.strokeStyle="#1b2232";
  for(let i=0;i<=5;i++){
    const p=lo+(hi-lo)*i/5;
    ctx.beginPath();ctx.moveTo(0,y(p));ctx.lineTo(W-padR,y(p));ctx.stroke();
    ctx.fillText(p.toFixed(0),W-padR+6,y(p)+4);
  }

  if(document.getElementById("hz").checked){
    ORDER.slice(ORDER.indexOf(frame)+1).forEach(f=>{
      fblocks(f).forEach(b=>{
        if(b.hi<lo||b.lo>hi)return;
        zone(b,cs,cw,W,padR,y,cl,f,true);
      });
    });
  }

  fblocks(frame).forEach(b=>zone(b,cs,cw,W,padR,y,cl,null,false));

  if(document.getElementById("lv").checked){
    (DATA.levels||[]).forEach(l=>{
      if(!LC[l.k])return;
      if(l.p<lo||l.p>hi)return;
      const col=LC[l.k];
      const yy=y(l.p);
      ctx.strokeStyle="rgba("+col+",0.8)";
      ctx.lineWidth=1;
      ctx.setLineDash([2,4]);
      ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle="rgba("+col+",1)";
      ctx.font="10px sans-serif";
      ctx.textAlign="right";
      ctx.fillText(l.n+" "+l.p.toFixed(1),W-padR-4,yy-3);
      ctx.textAlign="left";
      ctx.font="11px sans-serif";
    });
  }

  cs.forEach((c,i)=>{
    const x=i*cw+cw/2;
    const up=c.c>=c.o;
    ctx.strokeStyle=ctx.fillStyle=up?"#2dd4bf":"#f87171";
    ctx.beginPath();ctx.moveTo(x,y(c.h));ctx.lineTo(x,y(c.l));ctx.stroke();
    const top=y(Math.max(c.o,c.c));
    const hgt=Math.max(1,Math.abs(y(c.o)-y(c.c)));
    ctx.fillRect(x-cw*0.35,top,cw*0.7,hgt);
  });

  (DATA.entries||[]).forEach(e=>{
    let idx=-1;
    for(let i=0;i<cs.length;i++){if(cs[i].t<=e.t)idx=i;}
    if(idx<0)return;
    const x=idx*cw+cw/2;
    ctx.fillStyle="#facc15";
    ctx.beginPath();
    if(e.kind==="long"){
      const yy=cl(y(cs[idx].l))+3;
      ctx.moveTo(x,yy);ctx.lineTo(x-7,yy+12);ctx.lineTo(x+7,yy+12);
    }else{
      const yy=cl(y(cs[idx].h))-3;
      ctx.moveTo(x,yy);ctx.lineTo(x-7,yy-12);ctx.lineTo(x+7,yy-12);
    }
    ctx.closePath();ctx.fill();
  });

  const last=cs[cs.length-1].c;
  ctx.fillStyle="#2b6cff";
  ctx.fillRect(W-padR,y(last)-9,padR,18);
  ctx.fillStyle="#fff";
  ctx.fillText(last.toFixed(1),W-padR+4,y(last)+4);
}

function list(){
  const el=document.getElementById("list");
  const bl=fblocks(frame).slice().sort((a,b)=>b.t-a.t);
  el.innerHTML=bl.map(b=>
    '<div class="z '+b.kind+(b.with?'':' ag')+'"><div><b>'+(b.kind==="long"?"Long":"Short")+
    '</b> '+b.lo.toFixed(2)+' - '+b.hi.toFixed(2)+
    '<small>'+new Date(b.t*1000).toLocaleString("de-DE")+
    (b.n>1?' · '+b.n+' Zonen zusammengefasst':'')+
    (b.with?'':' · gegen Trend')+'</small></div>'+
    '<div class="st">'+ST[b.status]+'</div></div>'
  ).join("")||"<p>Keine Zonen</p>";

  const en=document.getElementById("ent");
  const es=(DATA.entries||[]).slice().sort((a,b)=>b.t-a.t).slice(0,10);
  en.innerHTML=es.map(e=>
    '<div class="z e '+e.kind+'"><div><b>'+(e.kind==="long"?"Long":"Short")+
    '-Einstieg</b> ca. '+e.price.toFixed(2)+
    '<small>'+new Date(e.t*1000).toLocaleString("de-DE")+
    ' · Zone '+e.lo.toFixed(2)+' - '+e.hi.toFixed(2)+'</small></div>'+
    '<div class="st">Stop<br>'+e.stop.toFixed(2)+'</div></div>'
  ).join("")||"<p>Noch keine Einstiege</p>";

  const hs=DATA.history||[];
  const w=hs.filter(h=>h.res==="Ziel").length;
  const l=hs.filter(h=>h.res==="Stop").length;
  const o=hs.length-w-l;
  const rate=(a,b)=>(a+b)?Math.round(100*a/(a+b))+" %":"-";
  const net=w-l;
  const tw=hs.filter(h=>h.fit===true&&h.res==="Ziel").length;
  const tl=hs.filter(h=>h.fit===true&&h.res==="Stop").length;
  const aw=hs.filter(h=>h.fit===false&&h.res==="Ziel").length;
  const al=hs.filter(h=>h.fit===false&&h.res==="Stop").length;
  let extra="";
  if(tw+tl+aw+al>0){
    extra='<br>Mit H1-Trend: '+tw+' Ziel / '+tl+' Stop ('+rate(tw,tl)+')'+
      '<br>Gegen den Trend: '+aw+' Ziel / '+al+' Stop ('+rate(aw,al)+')';
  }
  document.getElementById("stat").innerHTML=hs.length?
    '<div class="z"><div><b>'+w+' Ziel · '+l+' Stop · '+o+' offen oder unklar</b>'+
    '<small>Trefferquote '+rate(w,l)+' · Ergebnis '+(net>=0?'+':'')+net+' R (1 R = dein Risiko, ohne Spanne und Kosten)'+extra+'</small></div></div>':
    "<p>Noch keine Signale</p>";

  const RL2={Ziel:"Ziel erreicht",Stop:"Stop erreicht",offen:"offen",unklar:"unklar"};
  const RC2={Ziel:"win",Stop:"loss",offen:"open",unklar:"unk"};
  const bs=DATA.brk_history||[];
  const bwin=bs.filter(h=>h.res==="Ziel").length;
  const bloss=bs.filter(h=>h.res==="Stop").length;
  document.getElementById("bstat").innerHTML=bs.length?
    '<div class="z"><div><b>'+bwin+' Ziel · '+bloss+' Stop · '+(bs.length-bwin-bloss)+' offen oder unklar</b>'+
    '<small>Trefferquote '+rate(bwin,bloss)+' · Ergebnis '+((bwin-bloss)>=0?'+':'')+(bwin-bloss)+' R ohne Spanne. Testphase: erst nach 80 bis 100 Signalen aussagekräftig.</small></div></div>':
    "<p>Noch keine Ausbruch-Signale</p>";
  document.getElementById("bhist").innerHTML=bs.slice(0,30).map(h=>
    '<div class="z h '+RC2[h.res]+'"><div><b>'+(h.kind==="long"?"Long":"Short")+
    '</b> Einstieg '+h.price.toFixed(2)+
    '<small>Stop '+h.stop.toFixed(2)+' · Ziel '+h.target.toFixed(2)+'<br>'+
    new Date((h.t+60)*1000).toLocaleString("de-DE")+
    '</small></div><div class="st"><b>'+RL2[h.res]+'</b></div></div>'
  ).join("");

  const RL={Ziel:"Ziel erreicht",Stop:"Stop erreicht",offen:"offen",unklar:"unklar"};
  const RC={Ziel:"win",Stop:"loss",offen:"open",unklar:"unk"};
  document.getElementById("hist").innerHTML=hs.slice(0,30).map(h=>
    '<div class="z h '+RC[h.res]+'"><div><b>'+(h.kind==="long"?"Long":"Short")+
    '</b> Einstieg '+h.price.toFixed(2)+
    '<small>Stop '+h.stop.toFixed(2)+' · Ziel 1:1 '+h.target.toFixed(2)+'<br>'+
    new Date(h.t*1000).toLocaleString("de-DE")+
    (h.rt?' → '+new Date(h.rt*1000).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):'')+
    '</small></div><div class="st"><b>'+RL[h.res]+'</b></div></div>'
  ).join("")||"<p>Noch keine Signale</p>";
}

function render(){draw();list();info();}

document.getElementById("tabs").addEventListener("click",e=>{
  if(e.target.dataset.f){
    frame=e.target.dataset.f;
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b===e.target));
    render();
  }
});
["lv","hz","inv","ag"].forEach(id=>document.getElementById(id).addEventListener("change",render));
window.addEventListener("resize",draw);
load();
setInterval(load,60000);
</script>
</body>
</html>
