<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orderblock Radar</title>
<style>
body{margin:0;background:#0b0f17;color:#e6e9ef;font-family:system-ui,sans-serif}
header{padding:12px 14px 4px}
h1{font-size:18px;margin:0 0 4px}
h2{font-size:15px;margin:14px 0 0}
#upd{font-size:12px;color:#8b93a5}
#ov{margin-top:8px;font-size:14px}
#ov .o{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;margin-top:4px;border-radius:8px;background:#141a26;border-left:4px solid #6b7280;border-right:2px solid transparent}
#ov .o.long{border-left-color:#22c55e}
#ov .o.short{border-left-color:#ef4444}
#ov .o.sel{background:#1d2740;border-right-color:#2b6cff}
#ov .o b.long{color:#4ade80}
#ov .o b.short{color:#f87171}
#ov .o b.neutral{color:#9ca3af}
#ov .o small{color:#8b93a5;margin-left:8px}
#key{font-size:13px;margin-top:8px}
#key .r{color:#f87171}
#key .s{color:#4ade80}
#in{font-size:13px;margin-top:6px;color:#facc15}
.tabs{display:flex;gap:8px;padding:8px 14px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid #2a3142;background:#141a26;color:#e6e9ef;font-size:15px}
.tabs button.on{background:#2b6cff;border-color:#2b6cff}
.tabs button.zm{flex:0 0 48px;font-size:20px;padding:6px}
canvas{width:100%;height:62vh;display:block;touch-action:pan-y}
label{display:block;padding:4px 14px;font-size:14px;color:#8b93a5}
.list{padding:0 14px 20px}
.z{display:flex;justify-content:space-between;padding:10px;margin-top:8px;border-radius:10px;background:#141a26;border-left:4px solid}
.z.long{border-color:#22c55e}
.z.short{border-color:#ef4444}
.z.ag{opacity:.55}
.z small{color:#8b93a5;display:block}
.st{font-size:13px;align-self:center;text-align:right}
</style>
</head>
<body>
<header>
<h1>Orderblock Radar</h1>
<div id="upd">Lade...</div>
<div id="ov"></div>
<div id="key"></div>
<div id="in"></div>
</header>
<div class="tabs" id="tabs">
<button data-f="M5" class="on">M5</button>
<button data-f="H1">H1</button>
<button class="zm" id="zin">+</button>
<button class="zm" id="zout">−</button>
</div>
<canvas id="cv"></canvas>
<label><input type="checkbox" id="lv" checked> Linien: Vortag und Tag (PDH/PDL, Hoch/Tief)</label>
<label><input type="checkbox" id="hz"> H1-Zonen im M5-Chart zeigen</label>
<div class="list">
<h2 id="zt">Zonen</h2>
<div id="list"></div>
</div>
<script>
let DATA=null,frame="M5",cur="gold",NC={M5:60,H1:60};
const STEPS=[30,45,60,90,150];
try{const s=localStorage.getItem("mk");if(s)cur=s;}catch(e){}
const cv=document.getElementById("cv");
const ctx=cv.getContext("2d");
const ST={frisch:"Frisch",angetestet:"Angetestet"};
const TR={long:"▲ Long",short:"▼ Short",neutral:"► Neutral"};
const LC={pd:"251,146,60",day:"96,165,250"};

function M(){
  if(!DATA)return null;
  return DATA.markets.find(m=>m.key===cur)||DATA.markets[0]||null;
}
function fx(v,m){return v.toFixed(m.dec>2?m.dec:(m.price>1000?1:2));}

async function load(){
  try{
    const r=await fetch("data.json?"+Date.now());
    DATA=await r.json();
    document.getElementById("upd").textContent=
      "Stand: "+new Date(DATA.updated).toLocaleString("de-DE");
    render();
  }catch(e){
    document.getElementById("upd").textContent="Daten konnten nicht geladen werden ("+e.message+")";
  }
}

function lastPrice(m){const cs=m.frames.M5.candles;return cs[cs.length-1].c;}

function overview(){
  const el=document.getElementById("ov");
  el.innerHTML=DATA.markets.map(m=>
    '<div class="o '+m.trend+(m.key===M().key?' sel':'')+'" data-k="'+m.key+'"><span>'+m.name+
    '<small>'+fx(m.price,m)+(m.stale?' (alt)':'')+'</small></span><b class="'+m.trend+'">'+TR[m.trend]+'</b></div>').join("");
}

function info(){
  const m=M();
  const last=lastPrice(m);
  const r=[];
  ["H1","M5"].forEach(f=>{
    m.frames[f].blocks.forEach(b=>{
      if(last>=b.lo&&last<=b.hi){
        r.push(f+" "+(b.kind==="long"?"Long":"Short")+" "+fx(b.lo,m)+" - "+fx(b.hi,m)+(b.fvg==="offen"?" (FVG ?)":""));
      }
    });
  });
  document.getElementById("in").textContent=
    r.length?"Kurs liegt in: "+r.join(" · "):"Kurs liegt in keiner Zone";
  const k=m.keyl||{};
  let h="";
  const num=v=>typeof v==="number"&&isFinite(v);
  if(k.res&&num(k.res.p))h+='<span class="r">Widerstand '+fx(k.res.p,m)+' ('+k.res.n+')</span>';
  if(k.res&&k.sup&&num(k.res.p)&&num(k.sup.p))h+=" · ";
  if(k.sup&&num(k.sup.p))h+='<span class="s">Support '+fx(k.sup.p,m)+' ('+k.sup.n+')</span>';
  document.getElementById("key").innerHTML=h;
}

function niceStep(range,n){
  const raw=range/n;
  const p=Math.pow(10,Math.floor(Math.log10(raw)));
  const f=raw/p;
  return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p;
}

function box(t,lo,hi,cs,cw,W,padR,y,cl,col,alpha,line,dash,label){
  let idx=cs.findIndex(c=>c.t>=t);
  if(idx<0)return;
  const x0=idx*cw;
  const y1=cl(y(hi)),y2=cl(y(lo));
  const h=Math.max(2,y2-y1);
  ctx.fillStyle="rgba("+col+","+alpha+")";
  ctx.fillRect(x0,y1,W-padR-x0,h);
  ctx.strokeStyle="rgba("+col+","+line+")";
  ctx.setLineDash(dash?[5,3]:[]);
  ctx.strokeRect(x0,y1,W-padR-x0,h);
  ctx.setLineDash([]);
  if(label){
    ctx.fillStyle="rgba("+col+",1)";
    ctx.font="bold 11px sans-serif";
    ctx.fillText(label,Math.max(x0+4,4),y1+12);
    ctx.font="11px sans-serif";
  }
}

function zone(b,cs,cw,W,padR,y,cl,name,m){
  const col=b.kind==="long"?"34,197,94":"239,68,68";
  const f=b.with?1:0.4;
  const a=(b.status==="angetestet"?0.15:0.30)*f;
  const lab=(name?name+" ":"")+"OB"+(b.fvg==="offen"?" (FVG ?)":"");
  box(b.t,b.lo,b.hi,cs,cw,W,padR,y,cl,col,a,0.9*f,!!name,lab);
}

function visibleBlocks(m,f,t0){
  // Zonen, die im sichtbaren Ausschnitt noch gelten; Beginn vor dem Ausschnitt -> am linken Rand starten
  return m.frames[f].blocks.map(b=>Object.assign({},b,{t:Math.max(b.t,t0)}));
}

function draw(){
  const d=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*d;cv.height=H*d;
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,W,H);
  const m=M();
  if(!m)return;
  const all=m.frames[frame].candles;
  const cs=all.slice(-NC[frame]);
  let lo=Math.min(...cs.map(c=>c.l));
  let hi=Math.max(...cs.map(c=>c.h));
  const pad=(hi-lo)*0.06||1;
  lo-=pad;hi+=pad;
  const padR=58,padT=10,padB=16;
  const cw=(W-padR)/cs.length;
  const y=p=>padT+(hi-p)/(hi-lo)*(H-padT-padB);
  const cl=v=>Math.max(padT,Math.min(H-padB,v));
  const t0=cs[0].t;

  ctx.font="11px sans-serif";
  const step=niceStep(hi-lo,8);
  const dec=step>=1?0:Math.min(5,Math.max(0,Math.ceil(-Math.log10(step))));
  for(let p=Math.ceil(lo/step)*step;p<=hi;p+=step){
    ctx.strokeStyle="#1b2232";
    ctx.beginPath();ctx.moveTo(0,y(p));ctx.lineTo(W-padR,y(p));ctx.stroke();
    ctx.fillStyle="#8b93a5";
    ctx.fillText(p.toFixed(dec),W-padR+6,y(p)+4);
  }

  if(document.getElementById("hz").checked&&frame==="M5"){
    visibleBlocks(m,"H1",t0).forEach(b=>{
      if(b.hi<lo||b.lo>hi)return;
      zone(b,cs,cw,W,padR,y,cl,"H1",m);
    });
  }
  visibleBlocks(m,frame,t0).forEach(b=>{
    if(b.hi<lo||b.lo>hi)return;
    zone(b,cs,cw,W,padR,y,cl,null,m);
  });

  if(document.getElementById("lv").checked){
    (m.levels||[]).forEach(l=>{
      if(!LC[l.k])return;
      if(l.p<lo||l.p>hi)return;
      const col=LC[l.k];
      const yy=y(l.p);
      ctx.strokeStyle="rgba("+col+",0.8)";
      ctx.lineWidth=1;
      ctx.setLineDash([2,4]);
      ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle="rgba("+col+",1)";
      ctx.font="10px sans-serif";
      ctx.textAlign="right";
      ctx.fillText(l.n+" "+fx(l.p,m),W-padR-4,yy-3);
      ctx.textAlign="left";
      ctx.font="11px sans-serif";
    });
  }

  cs.forEach((c,i)=>{
    const x=i*cw+cw/2;
    const up=c.c>=c.o;
    ctx.strokeStyle=ctx.fillStyle=up?"#2dd4bf":"#f87171";
    ctx.lineWidth=cw>6?1.5:1;
    ctx.beginPath();ctx.moveTo(x,y(c.h));ctx.lineTo(x,y(c.l));ctx.stroke();
    ctx.lineWidth=1;
    const top=y(Math.max(c.o,c.c));
    const hgt=Math.max(1,Math.abs(y(c.o)-y(c.c)));
    ctx.fillRect(x-cw*0.36,top,cw*0.72,hgt);
  });

  const last=cs[cs.length-1].c;
  ctx.fillStyle="#2b6cff";
  ctx.fillRect(W-padR,y(last)-9,padR,18);
  ctx.fillStyle="#fff";
  ctx.fillText(fx(last,m),W-padR+4,y(last)+4);
}

function list(){
  const m=M();
  document.getElementById("zt").textContent="Zonen "+m.name+" ("+frame+")";
  const last=lastPrice(m);
  const bl=m.frames[frame].blocks.slice().sort((a,b)=>Math.abs((a.lo+a.hi)/2-last)-Math.abs((b.lo+b.hi)/2-last));
  document.getElementById("list").innerHTML=bl.map(b=>
    '<div class="z '+b.kind+(b.with?'':' ag')+'"><div><b>'+(b.kind==="long"?"Long":"Short")+
    '</b> '+fx(b.lo,m)+' - '+fx(b.hi,m)+
    '<small>'+new Date(b.t*1000).toLocaleString("de-DE")+' · FVG '+(b.fvg==='ja'?'✓':'?')+' · '+(b.with?'im Trend':'gegen Trend')+'</small></div>'+
    '<div class="st">'+ST[b.status]+'</div></div>'
  ).join("")||"<p>Keine Zonen</p>";
}

function render(){
  if(!DATA||!DATA.markets||!DATA.markets.length)return;
  let err="";
  [overview,info,list,draw].forEach(f=>{try{f();}catch(e){err+=" "+f.name+": "+e.message;console.error(e);}});
  if(err)document.getElementById("upd").textContent+=" · Anzeigefehler:"+err;
}

document.getElementById("tabs").addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.f){
    frame=t.dataset.f;
    document.querySelectorAll("#tabs button[data-f]").forEach(b=>b.classList.toggle("on",b===t));
    render();
  }
});
function zoom(dir){
  let i=STEPS.indexOf(NC[frame]);if(i<0)i=2;
  i=Math.max(0,Math.min(STEPS.length-1,i+dir));
  NC[frame]=STEPS[i];
  draw();
}
document.getElementById("zin").addEventListener("click",()=>zoom(-1));
document.getElementById("zout").addEventListener("click",()=>zoom(1));
document.getElementById("ov").addEventListener("click",e=>{
  const o=e.target.closest(".o");
  if(!o)return;
  cur=o.dataset.k;
  try{localStorage.setItem("mk",cur);}catch(err){}
  render();
});
["lv","hz"].forEach(id=>document.getElementById(id).addEventListener("change",render));
window.addEventListener("resize",draw);
load();
setInterval(load,60000);
</script>
</body>
</html>
